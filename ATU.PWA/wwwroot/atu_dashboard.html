<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATU Dashboard en Vivo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f6;
            padding: 20px;
        }

        .event-card {
            border-left: 5px solid #ccc;
            padding: 15px;
            margin-bottom: 10px;
            background: white;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .green {
            border-color: #28a745;
        }

        .yellow {
            border-color: #ffc107;
        }

        .red {
            border-color: #dc3545;
        }

        .blue {
            border-color: #007bff;
        }

        .status-badge {
            font-weight: bold;
            text-transform: uppercase;
            font-size: 12px;
        }

        #connection-status {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        .connected {
            background: #d4edda;
            color: #155724;
        }

        .disconnected {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>

    <h1>📡 Monitor de Autorizaciones ATU</h1>
    <div id="connection-status" class="disconnected">Desconectado del servidor...</div>

    <div id="events-container">
        <!-- Los eventos llegarán aquí -->
    </div>

    <!-- ✅ LIBRERÍA DE SIGNALR (CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>

    <script>
        // ⚠️ CAMBIA ESTA URL AL PUERTO DONDE CORRE TU ATU.AuthService ⚠️
        const AUTH_SERVICE_URL = "/audit-hub";

        const statusDiv = document.getElementById("connection-status");
        const container = document.getElementById("events-container");

        // Construir la conexión
        const connection = new signalR.HubConnectionBuilder()
            .withUrl(AUTH_SERVICE_URL, { withCredentials: false })
            .withAutomaticReconnect([0, 2000, 5000, 10000, 30000]) // Reintenta si se cae
            .configureLogging(signalR.LogLevel.Information)
            .build();

        // Función para pintar la tarjeta en pantalla
        function addEventToUI(event) {
            const card = document.createElement("div");
            card.className = `event-card ${event.status}`;

            const time = new Date(event.timestamp).toLocaleTimeString('es-MX');
            const fraudWarning = event.isFraud ? '<div style="color:red; font-weight:bold; margin-top:10px;">🚨 ¡ALERTA DE FRAUDE DETECTADA!🚨</div>' : '';

            card.innerHTML = `
                    <div><span class="status-badge" style="color: ${event.status === 'red' ? 'red' : event.status === 'green' ? 'green' : 'orange'}">${event.status}</span> - <strong>${time}</strong></div>
                    <h3 style="margin: 5px 0;">${event.title}</h3>
                    <p style="margin: 5px 0; color: #555;">${event.message}</p>
                    <div style="font-size: 12px; color: #888;">
                        Lote: ${event.batchId || 'N/A'} | Supervisor: ${event.supervisorId || 'N/A'} | Operador: ${event.operatorId || 'N/A'}
                    </div>
                    ${fraudWarning}
                `;

            // Insertar el nuevo evento arriba del todo
            container.prepend(card);
        }

        // Escuchar el evento principal que manda tu OTPController
        connection.on("AuditEvent", (event) => {
            console.log("Evento recibido:", event);
            addEventToUI(event);

            // Si es fraude, lanzar alerta nativa del navegador
            if (event.isFraud) {
                alert("¡INTENTO DE FRAUDE!\n" + event.message);
            }
        });

        // Escuchar el evento de nueva solicitud (cuando CargaEmbarques pide autorización)
        connection.on("NuevoFolioAdelantado", (notif) => {
            console.log("Nueva solicitud de folio:", notif);
            addEventToUI({
                status: "blue",
                title: "🔔 Nueva Solicitud de Folio",
                message: `Embarque ${notif.embFolio} - Producto: ${notif.producto}. Motivo: ${notif.motivo}`,
                supervisorId: notif.responsable,
                timestamp: new Date().toISOString()
            });
        });

        // Manejo de estado de conexión
        connection.onreconnecting(() => {
            statusDiv.className = "disconnected";
            statusDiv.innerText = "Perdiendo conexión... Reconectando";
        });

        connection.onreconnected(() => {
            statusDiv.className = "connected";
            statusDiv.innerText = "Reconectado al servidor";
        });

        connection.onclose(() => {
            statusDiv.className = "disconnected";
            statusDiv.innerText = "Desconectado. Intentando reconectar...";
        });

        // Iniciar conexión
        async function startConnection() {
            try {
                await connection.start();
                statusDiv.className = "connected";
                statusDiv.innerText = "Conectado en tiempo real al servidor ATU";
                console.log("SignalR Connected.");
            } catch (err) {
                console.error(err);
                setTimeout(startConnection, 5000); // Reintento manual
            }
        }

        startConnection();
    </script>
</body>
</html>
